<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toba · Geometry Lab</title></head><body><div id="app"><header><a class="brand" href="./">TOBA<span>GEOMETRY LAB</span></a><h1>Traditional Batak Toba Indonesian House.</h1></header><main><section class="workspace"><div class="viewer-top"><div class="viewer-heading"><button id="toggle-parameters" aria-controls="parameter-panel" aria-expanded="true">Parameters</button><span class="live-status"><span class="status-dot"></span> LIVE GEOMETRY <span class="muted">/ metres</span></span></div><div id="views"><button data-view="perspective">3D</button><button data-view="axonometric" class="active" title="Orthographic axonometric view">Axon</button><button data-view="front">Front</button><button data-view="side">Side</button><button data-view="plan">Plan</button></div></div><div id="viewer" aria-label="Interactive 3D Toba house model"><aside id="parameter-panel" aria-label="Model parameters"><div class="panel-heading"><h2>Parameters</h2><button id="close-parameters" aria-label="Close parameters">×</button></div><div id="controls"></div><button id="reset" class="reset">↺ Reset reference parameters</button></aside><div id="render-error" hidden>3D rendering is unavailable. Try a browser with WebGL enabled.</div></div><div class="viewer-bottom"><button id="render-style" aria-pressed="false" title="Shaded timber with black feature edges">Render view <span>OFF</span></button><button id="wire">Wireframe <span>OFF</span></button></div><div class="metrics"><div><span>FLOOR FOOTPRINT</span><strong id="footprint"></strong></div><div><span>HIGHEST ROOF POINT</span><strong id="height"></strong></div></div><section class="layer-panel"><div><div class="eyebrow">ASSEMBLY LAYERS</div><h2>Read the structure.</h2></div><div id="layers"></div></section></section></main><footer><span>FORM · STRUCTURE · RELATIONSHIP</span></footer></div><script type="module" src="/src/main.js"></script></body></html>
